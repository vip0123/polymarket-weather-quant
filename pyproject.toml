[project]
name = "poly-data"
version = "0.1.0"
description = "A comprehensive data pipeline for fetching, processing, and analyzing Polymarket trading data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Warproxxx", email = "" }
]

dependencies = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "requests>=2.31.0",
    "gql[requests]>=3.4.0",
    "flatten-json>=0.1.13",
    "py-builder-relayer-client==0.0.2rc1",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
]
dashboard = [
    "py-clob-client>=0.34.6",
    "py-clob-client-v2>=1.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.32.0",
    "web3>=6.0",
    "websockets>=15.0.1",
    "socksio>=1.0.0",
    "PySocks>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_utils", "update_utils"]

[tool.uv]
dev-dependencies = []
